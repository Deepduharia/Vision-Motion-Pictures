
name: Build

on:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout Code
      uses: actions/checkout@v5


    - name: Setup Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: 24


    - name: Check Node Version
      run: node -v


    - name: Install Dependencies
      run: npm install


    - name: Build Website
      run: npm run build
